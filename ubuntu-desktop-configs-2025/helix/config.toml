[editor]
shell = ["bash", "-c"]
true-color = true

[editor.statusline]
right = ["diagnostics", "selections", "register", "position", "total-line-numbers", "file-encoding"]

[editor.lsp]
display-inlay-hints = false

# I'm a big boy now
[keys.insert]
up = "no_op"
down = "no_op"
left = "no_op"
right = "no_op"
pageup = "no_op"
pagedown = "no_op"
home = "no_op"
end = "no_op"

[editor.soft-wrap]
enable = true
wrap-indicator = ""

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[keys.normal]
"-" = ":write"
0 = ":echo %sh{wc \"%{buffer_name}\"}"

[keys.normal."+"]
W = ":echo %sh{wc \"%{buffer_name}\"}"
