
;==========================================================
;
;   Polybar config for i3wm with GPU monitoring
;
;==========================================================

[colors]
background = #282828
foreground = #ebdbb2
alert = #fb4934
primary = #83a598

[bar/main]
width = 100%
height = 50
fixed-center = true
bottom = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3
border-size = 0
padding-left = 1
padding-right = 2

module-margin-left = 1
module-margin-right = 1

font-0 = monospace:size=18;2
font-1 = Font Awesome 6 Free:style=Solid:size=10;2

modules-left = i3
modules-center = date
modules-right = cpu cpu-temp memory disk gpu-usage gpu-temp gpu-memory network-up network-down

; This shows the ethernet connector thing and the keyboard layout indicator.
; Those come from nm-applet and IBus respectively.
; tray-position = right
; tray-padding = 2

cursor-click = pointer
cursor-scroll = ns-resize

; Make polybar work with i3
override-redirect = false
wm-restack = i3

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true

label-mode-padding = 2
label-mode-foreground = #000
label-mode-background = ${colors.primary}

; Focused workspace
label-focused = %index%
label-focused-background = ${colors.primary}
label-focused-foreground = #000
label-focused-padding = 2

; Unfocused workspace
label-unfocused = %index%
label-unfocused-padding = 2

; Visible but not focused
label-visible = %index%
label-visible-background = #555
label-visible-padding = 2

; Urgent workspace
label-urgent = %index%!
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU: "
format-prefix-foreground = ${colors.primary}
label = %percentage-sum%%

[module/memory]
type = custom/script
exec = free -m | awk '/^Mem:/ {printf "%.1f/%.1fG", $3/1024, $2/1024}'
interval = 2
format-prefix = "RAM: "
format-prefix-foreground = ${colors.primary}

[module/disk]
type = internal/fs
interval = 25
mount-0 = /
label-mounted = Disk: %free%
format-mounted-prefix-foreground = ${colors.primary}

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d
time = %H:%M:%S
label = %date% %time%

[module/gpu-usage]
type = custom/script
exec = nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits
interval = 2
format-prefix = "GPU: "
format-prefix-foreground = ${colors.primary}
label = %output%%

[module/gpu-memory]
type = custom/script
exec = nvidia-smi --query-gpu=memory.used,memory.total --format=csv,noheader,nounits | awk '{printf "%dMB/%dMB", $1, $2}'
interval = 2
format-prefix = "VRAM: "
format-prefix-foreground = ${colors.primary}

[module/network-up]
type = custom/script
exec = ~/.config/polybar/scripts/network.sh up
interval = 2
format-prefix = "↑ "
format-prefix-foreground = ${colors.primary}

[module/network-down]
type = custom/script
exec = ~/.config/polybar/scripts/network.sh down
interval = 2
format-prefix = "↓ "
format-prefix-foreground = ${colors.primary}

[module/cpu-temp]
type = internal/temperature
interval = 2
thermal-zone = 0
hwmon-path = /sys/class/hwmon/hwmon1/temp1_input
warn-temperature = 80
format-prefix = ""
format-prefix-foreground = ${colors.primary}
label = %temperature-c%

[module/gpu-temp]
type = custom/script
exec = nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader,nounits
interval = 2
format-prefix = ""
format-prefix-foreground = ${colors.primary}
label = %output%°C

[settings]
screenchange-reload = true

[global/wm]
margin-top = 0
margin-bottom = 0
